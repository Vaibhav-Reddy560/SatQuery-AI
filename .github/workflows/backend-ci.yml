name: SatQuery AI Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend API & MLOps Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Seeder Check
        run: |
          python scripts/init_db.py

      - name: Run PyTest API & Engine Test Suite
        run: |
          pytest backend/tests/

      - name: Execute VRSBench MLOps Evaluation Check
        run: |
          python scripts/eval_vrsbench.py

  build-docker:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: satquery-backend:latest
